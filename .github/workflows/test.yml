name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        working-directory: server
        run: npm ci

      - name: Test (calculator maths and assistant service)
        working-directory: server
        run: npm test
